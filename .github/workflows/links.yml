name: Check links

on:
  schedule:
    - cron: "0 3 * * 1"   # every Monday
  workflow_dispatch:
  pull_request:
    paths: ["README.md", "data/**"]

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links in README
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-concurrency 8 --timeout 20 --accept 200,201,202,203,204,206,301,302,303,307,308,403,429 README.md
          fail: false
      - name: Open an issue with broken links
        if: steps.lychee.outputs.exit_code != 0 && github.event_name == 'schedule'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Broken links found
          content-filepath: ./lychee/out.md
          labels: broken-links
